{% extends 'auth_base.html' %}
{% block title %}Entrar{% endblock %}
{% block content %}
<p class="eyebrow">ACESSO SEGURO</p><h1>Bem-vindo de volta</h1>
<p class="intro">Entre para acessar somente a sua carteira e os seus dados financeiros.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Usuário<input name="username" required autocomplete="username" autofocus placeholder="Seu usuário"></label>
<label>Senha<input type="password" name="password" required autocomplete="current-password" placeholder="Sua senha"></label>
<label class="remember-access"><input type="checkbox" name="remember" value="1"><span>Lembrar meu acesso por 30 dias</span></label>
<button>Entrar no Nexo</button></form>
<p class="auth-switch">Ainda não possui uma conta? <a href="{{ url_for('setup') }}">Criar conta</a></p>
{% endblock %}
